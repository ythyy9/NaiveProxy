name: Check deployment kit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: for file in scripts/*.sh; do bash -n "$file" || exit; done
      - run: python -m pip install 'h2>=4.3,<5'
      - run: mkdir .ci && bash scripts/download-server.sh .ci/caddy
      - run: bash scripts/download-hy2.sh .ci/hysteria
      - run: python tests/smoke.py .ci/caddy
      - run: python tests/smoke_hy2.py .ci/hysteria
      - run: sudo env GITHUB_ACTIONS=true bash tests/install-smoke.sh
