<header><small>FIELD NOTES / 日常观察</small><h1>山间札记</h1><p>记录散步、阅读和季节的细小变化。</p></header>
<main><article><h2>雨后的路</h2><p>雨停后，路边的石头颜色深了些。草叶上留着水，远处的山被薄雾挡住了轮廓。走到树下时，偶尔还有水滴落在肩上。</p><p>同一条路在不同天气里总有一点变化。今天记下这些，下次来时再看看。</p></article><article><h2>留一页空白</h2><p>读完一本书，先不急着写结论。把喜欢的句子抄下来，在旁边留出一点空白。过几天回来，有时会读出另一种意思。</p></article></main>
